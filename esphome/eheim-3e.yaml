# EHEIM professionel 3e -> ESP32-S3 (N16R8) + module XY-K485
# Câblage : GPIO17 -> TXD, GPIO18 -> RXD, 3V3 -> VCC, GND -> GND
#           A+ / B- / terre -> jack de la pompe (après vérification au multimètre)
# Fichiers : ce YAML + eheim3e.h dans le même dossier ESPHome.

esphome:
  name: eheim-3e
  friendly_name: Eheim 3e
  includes:
    - eheim3e.h

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: INFO

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Eheim-3e Fallback"

captive_portal:

# Page web sur l'ESP32 lui-même : http://eheim-3e.local (ou son adresse IP)
# Fonctionne sans Home Assistant.
web_server:
  port: 80
  version: 3
  auth:
    type: digest
    username: admin
    password: !secret web_password

uart:
  id: pump_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 512

globals:
  - id: pump_type
    type: int
    initial_value: "2076"
  - id: boot_stage        # 0 = lire firmware, 1 = lire type, 2 = fonctionnement normal
    type: int
    initial_value: "0"
  - id: pending_step      # palier à envoyer (-1 = rien)
    type: int
    initial_value: "-1"
  - id: set_retries
    type: int
    initial_value: "0"
  - id: last_ok
    type: uint32_t
    initial_value: "0"

# ---------------------------------------------------------------- interrogation
interval:
  - interval: 5s
    then:
      - lambda: |-
          auto *u = id(pump_uart);
          if (id(boot_stage) == 0) {
            eheim::send(u, eheim::DEV_BCAST, eheim::CMD_GET_DEVICEID);
            id(boot_stage) = 1;
          } else if (id(boot_stage) == 1) {
            eheim::send(u, eheim::DEV_PUMP, eheim::CMD_GET_PUMPVERSION);
            id(boot_stage) = 2;
          } else if (id(pending_step) >= 0) {
            eheim::send(u, eheim::DEV_PUMP, eheim::CMD_SET_CONSTANTFLOW, (uint8_t) id(pending_step));
            if (++id(set_retries) > 5) {
              ESP_LOGW("eheim", "Palier %d non confirmé par la pompe, abandon", id(pending_step));
              id(pending_step) = -1;
            }
          } else {
            eheim::send(u, eheim::DEV_PUMP, eheim::CMD_GET_ACTUALDATA);
          }
      - delay: 200ms
      - script.execute: parse_frames

script:
  - id: parse_frames
    then:
      - lambda: |-
          auto frames = eheim::read_frames(id(pump_uart));
          for (auto &f : frames) {
            uint8_t cmd = f[3];

            if (cmd == 0x10 && f.size() >= 55) {
              eheim::Data d;
              memcpy(&d, f.data() + 4, sizeof(d));
              id(last_ok) = millis();

              int consigne = eheim::flow_lh(id(pump_type), d.soll_step);
              int mesure = d.dfs * 60 / 100;
              int since_h = d.actual_time / 60;
              int total = since_h + d.wartung_hours;

              id(debit_consigne).publish_state(consigne);
              id(debit_mesure).publish_state(mesure);
              if (consigne > 0) id(debit_relatif).publish_state(100.0f * mesure / consigne);
              id(vitesse_rotor).publish_state(d.frequenz / 100 * 60);
              id(palier).publish_state(d.soll_step);
              if (id(pending_step) < 0) id(palier_reglage).publish_state(d.soll_step);
              id(heures_fonctionnement).publish_state(d.run_time / 60);
              id(heures_depuis_entretien).publish_state(since_h);
              id(heures_avant_entretien).publish_state(d.wartung_hours);
              auto now = id(sys_time).now();
              if (now.is_valid()) {
                time_t t = now.timestamp + (time_t) d.wartung_hours * 3600;
                char buf[16];
                strftime(buf, sizeof(buf), "%Y-%m-%d", localtime(&t));
                if (id(prochain_entretien).state != buf) id(prochain_entretien).publish_state(buf);
              }
              if (total > 0) id(encrassement).publish_state(since_h * 100 / total);
              id(courant_brut).publish_state(d.current);
              id(mode_brut).publish_state(d.pumpe_mode);

              uint16_t m = (uint16_t) d.pumpe_mode;
              id(pompe_en_marche).publish_state(d.pumpe_on != 0);
              id(erreur_rotor).publish_state(m & eheim::PM_ROTOR_ERR);
              id(erreur_air).publish_state(m & eheim::PM_AIR_ERR);
              id(erreur_temperature).publish_state(m & eheim::PM_TEMP_ERR);
              id(consigne_non_atteinte).publish_state(m & 0x0002);

              std::string mode;
              if (m & 0x0010) mode = "Manuel";
              else if (m & 0x0008) mode = "Stream (pulsé)";
              else if (m & 0x0004) mode = "Bio 12 h";
              else if (m & 0x0001) mode = "Flux constant";
              else mode = "Inconnu";
              if (m & (eheim::PM_ROTOR_ERR | eheim::PM_AIR_ERR | eheim::PM_TEMP_ERR)) mode += " (erreur)";
              if (id(mode_pompe).state != mode) id(mode_pompe).publish_state(mode);

            } else if (cmd == 0x90 && f.size() >= 6 && f[4] == eheim::CMD_SET_CONSTANTFLOW) {
              ESP_LOGI("eheim", "Palier %d accepté par la pompe", id(pending_step));
              id(pending_step) = -1;

            } else if (cmd == 0x90 && f.size() >= 6 && f[4] == eheim::CMD_GET_PUMPVERSION) {
              id(pump_type) = 2000 + f[5];
              id(type_pompe).publish_state(to_string(id(pump_type)));

            } else if (cmd == 0xFF && f.size() >= 6) {
              char buf[12];
              snprintf(buf, sizeof(buf), "%u.%02u", f[4], f[5]);
              id(firmware).publish_state(buf);
            }
          }

# ---------------------------------------------------------------- capteurs
sensor:
  - platform: template
    id: debit_consigne
    name: "Débit de consigne"
    unit_of_measurement: "L/h"
    icon: mdi:target
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: debit_mesure
    name: "Débit mesuré"
    unit_of_measurement: "L/h"
    icon: mdi:water-pump
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: debit_relatif
    name: "Débit relatif"
    unit_of_measurement: "%"
    icon: mdi:gauge
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: vitesse_rotor
    name: "Vitesse rotor"
    unit_of_measurement: "tr/min"
    icon: mdi:rotate-right
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: palier
    name: "Palier actuel"
    icon: mdi:stairs
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: heures_fonctionnement
    name: "Temps de fonctionnement"
    unit_of_measurement: "h"
    icon: mdi:timer-outline
    state_class: total_increasing
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: heures_depuis_entretien
    name: "Heures depuis entretien"
    unit_of_measurement: "h"
    icon: mdi:wrench-clock
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: heures_avant_entretien
    name: "Heures avant entretien"
    unit_of_measurement: "h"
    icon: mdi:calendar-clock
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: encrassement
    name: "Encrassement (compteur)"
    unit_of_measurement: "%"
    icon: mdi:filter-outline
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: courant_brut
    name: "Courant (brut)"
    icon: mdi:current-ac
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
  - platform: template
    id: mode_brut
    name: "Mode (bits bruts)"
    icon: mdi:code-brackets
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never
  - platform: wifi_signal
    name: "Signal Wi-Fi"
    update_interval: 60s

binary_sensor:
  - platform: template
    id: pompe_en_marche
    name: "Pompe en marche"
    device_class: running
  - platform: template
    id: erreur_rotor
    name: "Erreur rotor"
    device_class: problem
  - platform: template
    id: erreur_air
    name: "Erreur air"
    device_class: problem
  - platform: template
    id: erreur_temperature
    name: "Erreur température"
    device_class: problem
  - platform: template
    id: consigne_non_atteinte
    name: "Consigne non atteinte"
    device_class: problem
    filters:
      - delayed_on: 5min
  - platform: template
    name: "Débit faible"
    device_class: problem
    lambda: |-
      if (!id(debit_relatif).has_state()) return {};
      return id(debit_relatif).state < 70.0f;
    filters:
      - delayed_on: 10min
      - delayed_off: 1min
  - platform: template
    name: "Pompe connectée"
    device_class: connectivity
    entity_category: diagnostic
    lambda: |-
      return id(last_ok) != 0 && (millis() - id(last_ok)) < 30000;

# Heure (pour la date du prochain entretien) : NTP, sans dépendre de Home Assistant
time:
  - platform: sntp
    id: sys_time
    timezone: Europe/Paris
    servers:
      - 0.pool.ntp.org
      - 1.pool.ntp.org
      - time.google.com

# ---------------------------------------------------------------- commande pompe
number:
  - platform: template
    id: palier_reglage
    name: "Palier débit (flux constant)"
    icon: mdi:tune-vertical
    min_value: 0
    max_value: 14
    step: 1
    mode: slider
    optimistic: true
    set_action:
      - lambda: |-
          id(pending_step) = (int) x;
          id(set_retries) = 0;
          ESP_LOGI("eheim", "Nouveau palier demandé : %d (%d L/h)", (int) x,
                   eheim::flow_lh(id(pump_type), (int) x));

text_sensor:
  - platform: template
    id: prochain_entretien
    name: "Prochain entretien"
    icon: mdi:calendar-check
  - platform: template
    id: mode_pompe
    name: "Mode"
    icon: mdi:waves
  - platform: template
    id: firmware
    name: "Firmware pompe"
    entity_category: diagnostic
  - platform: template
    id: type_pompe
    name: "Type de pompe"
    entity_category: diagnostic

button:
  - platform: restart
    name: "Redémarrer"
